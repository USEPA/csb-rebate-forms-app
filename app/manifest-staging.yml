---
applications:
  - name: csb-staging
    routes:
      - route: app-stage.app.cloud.gov/csb
    instances: 2
    memory: 256M
    disk_quota: 512M
    timeout: 180
    buildpacks:
      - nodejs_buildpack
    command: node app/index.js
    env:
      NODE_ENV: production
      LOGGER_LEVEL: INFO
      OPTIMIZE_MEMORY: true
    services:
      - s3-pub-csb-stage
      - log-drain
